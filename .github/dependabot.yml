version: 2

updates:
  # As actions ficam presas no SHA do commit. Isso protege contra tag movida,
  # mas congela tambem as correcoes: sem alguem avisando, o pin envelhece em
  # silencio. O dependabot e esse alguem.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(deps)"
    # So minor e patch entram no grupo. Major vem sozinho, um por PR.
    #
    # No SDK TypeScript um grupo sem esse filtro juntou quatro majors numa PR
    # chamada "bump the ferramentas group with 4 updates" -- quebrou o build e
    # o titulo nao dava pista nenhuma de que havia quatro quebras de
    # compatibilidade ali dentro.
    groups:
      ferramentas:
        patterns: ["*"]
        update-types: ["minor", "patch"]
